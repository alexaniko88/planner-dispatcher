# Settings for the planner and the dispatcher (schema 1).

# The command that runs Dart and the library commands.
dart: fvm dart

# Task clones start from origin/<base_branch>; pull requests target it; it is never pushed to.
base_branch: main

# Runs live in <system temp>/<run_folder>/<task id>.
run_folder: planner-dispatcher-runs

# Run in order in a fresh clone. A failure ends the run as failed.
setup:
  - fvm install --skip-pub-get
  - fvm flutter pub get

# Run in order after implementation. All must exit 0.
check:
  - fvm flutter analyze --no-pub
  - fvm flutter test

# Extra command prefixes the Claude implementer and tests stages may run.
allowed_commands:
  - fvm dart format
  - fvm flutter analyze
  - fvm flutter test
  - fvm flutter pub get

# Project files every role and the planner read first.
rules:
  - CLAUDE.md

# Changed .png files in this folder get before/after images in the pull request.
# goldens_dir: test/snapshots/goldens

# When set, launch refuses another git email.
# git_email_suffix: "@users.noreply.github.com"

# Label -> regex, added to the built-in private data scan.
# private_patterns:
#   a company email: "@example\\.com"

# Commit types allowed in commit subjects.
commit_types: [feat, fix, refactor, chore, docs, style, perf, test, build]

# Per tool and stage: model, effort, name (used in Co-Authored-By).
# models:
#   claude:
#     reviewer: {model: opus, effort: high, name: Opus 5.5}
